
name: Build AZA WARZONE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install

      - name: Prepare game
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

        
      - name: Configure landscape fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")

          pattern = re.compile(
              r'<activity\b(?=[^>]*android:name="\.MainActivity")[^>]*>',
              re.S
          )
          match = pattern.search(xml)

          if not match:
              raise SystemExit("MainActivity not found in AndroidManifest.xml")

          tag = match.group(0)
          if 'android:screenOrientation=' in tag:
              tag = re.sub(
                  r'android:screenOrientation="[^"]*"',
                  'android:screenOrientation="sensorLandscape"',
                  tag
              )
          else:
              tag = tag[:-1] + '\n            android:screenOrientation="sensorLandscape">'

          xml = xml[:match.start()] + tag + xml[match.end():]
          manifest.write_text(xml, encoding="utf-8")

          activity = Path(
              "android/app/src/main/java/com/aza/warzone/MainActivity.java"
          )
          activity.parent.mkdir(parents=True, exist_ok=True)
          activity.write_text("""package com.aza.warzone;

          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private void hideSystemBars() {
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(
                          getWindow(), getWindow().getDecorView()
                      );
                  controller.setSystemBarsBehavior(
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  );
                  controller.hide(WindowInsetsCompat.Type.systemBars());
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }
          }
          """, encoding="utf-8")
          PY
          

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AZA-WARZONE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
